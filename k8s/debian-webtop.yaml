apiVersion: v1
kind: Namespace
metadata:
  name: debian-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debian-desktop
  namespace: debian-lab
  labels:
    app: debian-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debian-desktop
  template:
    metadata:
      labels:
        app: debian-desktop
    spec:
      containers:
      - name: debian-desktop
        image: lscr.io/linuxserver/webtop:debian-xfce@sha256:918aa840a4374a2eb1ab5e05aebb7c869a6fb4563eb2015b829c08fa46725b2c  # pinned: update the digest deliberately
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Asia/Sakhalin"
        - name: SUBFOLDER
          value: "/"
        ports:
        - containerPort: 3000
          name: http-gui
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
        # privileged: the webtop image runs Docker (DinD) inside the server desktop.
        # The desktop has passwordless sudo, so never expose it beyond localhost.
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: debian-desktop-service
  namespace: debian-lab
spec:
  type: ClusterIP   # reached via kubectl port-forward only
  selector:
    app: debian-desktop
  ports:
  - port: 3000
    targetPort: 3000
    name: http-gui
