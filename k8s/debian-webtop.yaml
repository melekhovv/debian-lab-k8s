apiVersion: v1
kind: Namespace
metadata:
  name: debian-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debian-desktop
  namespace: debian-lab
  labels:
    app: debian-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debian-desktop
  template:
    metadata:
      labels:
        app: debian-desktop
    spec:
      containers:
      - name: debian-desktop
        image: lscr.io/linuxserver/webtop:debian-xfce
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Asia/Sakhalin"
        - name: SUBFOLDER
          value: "/"
        ports:
        - containerPort: 3000
          name: http-gui
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        securityContext:
          privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: debian-desktop-service
  namespace: debian-lab
spec:
  type: NodePort
  selector:
    app: debian-desktop
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
    name: http-gui
